name: Build

# Builds Peerscy for Linux, Windows and macOS from the private source repo and
# publishes the binaries here. This repository is public only to hold the
# compiled builds; the source stays private.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Peerscy ref to build (default: main)"
        required: false
        default: main
      platforms:
        description: "Platforms: all | linux | windows | macos"
        required: false
        default: all
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SOURCE_REPO: bruPav/peerscy

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref || github.ref }}
          token: ${{ secrets.REVYOU_PAT }}
      - id: v
        run: |
          V=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Peerscy v$V"

  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          case "${{ github.event.inputs.platforms }}" in
            linux)   M='["ubuntu-latest"]' ;;
            windows) M='["windows-2022"]' ;;
            macos)   M='["macos-latest"]' ;;
            *)       M='["ubuntu-latest","windows-2022","macos-latest"]' ;;
          esac
          echo "matrix={\"os\":$M}" >> "$GITHUB_OUTPUT"

  # Fail fast if a copyleft dependency (e.g. GPL) re-enters the tree: Peerscy is
  # distributed as a proprietary binary. Uses the private source's deny.toml.
  licenses:
    name: License gate
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref || github.ref }}
          token: ${{ secrets.REVYOU_PAT }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  build:
    name: ${{ matrix.os }}
    needs: [version, plan, licenses]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref || github.ref }}
          token: ${{ secrets.REVYOU_PAT }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libvulkan-dev glslc patchelf spirv-headers

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      # Linux and Windows: GPU via Vulkan. macOS: Metal (default).
      - name: Build (release, GPU / Vulkan)
        if: runner.os == 'Linux'
        run: cargo build --release --features gpu-vulkan

      # Pin CMake < 3.27: llama.cpp's Vulkan shader ExternalProject sets
      # `cmake_policy(CMP0147 NEW)` (parallel custom build steps), which races
      # the install step under MSBuild on newer CMake (MSB8066 / "VCEnd" /
      # missing cmake_install.cmake). CMP0147 does not exist in 3.26, so the
      # branch is skipped. Installed directly from Kitware (no extra action).
      - name: Use CMake 3.26 (pre-CMP0147)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "3.26.6"
          $dir = "C:\cmake-$ver"
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-x86_64.zip" -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive "$env:RUNNER_TEMP\cmake.zip" -DestinationPath $dir -Force
          "$dir\cmake-$ver-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\cmake-$ver-windows-x86_64\bin\cmake.exe" --version

      # Windows toolchain workaround. The runner's MSVC 19.44 (VS 17.14)
      # rejects the directory-with-trailing-backslash form of /Fd and /Fo
      # (`fatal error C1083: Cannot open compiler generated file: ''`) that
      # CMake emits during its compiler-identification try_compile. Pin the
      # older v142 toolset (MSVC 14.29), which accepts it, and use Ninja so
      # CMP0147 (a Visual-Studio-only policy) is irrelevant. vcvars must run
      # in the same step as the build so the environment persists.
      - name: Build (release, Windows / Vulkan)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.29
          cargo build --release --features gpu-vulkan

      - name: Build (release, macOS / Metal, universal2)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output target/release/peerscy-universal \
            target/x86_64-apple-darwin/release/peerscy \
            target/aarch64-apple-darwin/release/peerscy
          file target/release/peerscy-universal

      - name: Package Linux (tar.gz, bundled Vulkan loader)
        if: runner.os == 'Linux'
        run: |
          patchelf --set-rpath '$ORIGIN' target/release/peerscy
          mkdir -p dist/peerscy
          cp target/release/peerscy dist/peerscy/
          cp -L /usr/lib/x86_64-linux-gnu/libvulkan.so.1 dist/peerscy/
          cp LICENSE dist/peerscy/LICENSE
          cp THIRD_PARTY_LICENSES.md dist/peerscy/THIRD_PARTY_LICENSES.md
          cp peerscy.desktop dist/peerscy/
          cp packaging/linux/install.sh dist/peerscy/
          mkdir -p dist/peerscy/icon && cp -r icon/linux dist/peerscy/icon/
          tar -czf peerscy-linux-x86_64.tar.gz -C dist peerscy

      - name: Package Windows (zip, bundled Vulkan loader)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $loader = Join-Path $env:VULKAN_SDK 'Bin\vulkan-1.dll'
          if (-not (Test-Path $loader)) {
            $loader = (Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter 'vulkan-1.dll' |
              Select-Object -First 1).FullName
          }
          New-Item -ItemType Directory -Force -Path dist/peerscy | Out-Null
          Copy-Item target/release/peerscy.exe dist/peerscy/
          Copy-Item $loader dist/peerscy/vulkan-1.dll
          Copy-Item LICENSE dist/peerscy/LICENSE
          Copy-Item THIRD_PARTY_LICENSES.md dist/peerscy/THIRD_PARTY_LICENSES.md
          Compress-Archive -Path dist/peerscy -DestinationPath peerscy-windows-x86_64.zip

      - name: Package macOS (.app + dmg, universal)
        if: runner.os == 'macOS'
        run: |
          APP="Peerscy.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
          cp target/release/peerscy-universal "${APP}/Contents/MacOS/peerscy"
          cp macos/Info.plist "${APP}/Contents/"
          cp icon/peerscy.icns "${APP}/Contents/Resources/Peerscy.icns"
          cp THIRD_PARTY_LICENSES.md "${APP}/Contents/Resources/THIRD_PARTY_LICENSES.md"
          cp LICENSE "${APP}/Contents/Resources/LICENSE"
          hdiutil create -volname "Peerscy" -srcfolder "${APP}" \
            -ov -format UDZO "peerscy-macos-universal.dmg"

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: peerscy-${{ matrix.os }}
          if-no-files-found: error
          path: |
            peerscy-linux-x86_64.tar.gz
            peerscy-windows-x86_64.zip
            peerscy-macos-universal.dmg

  release:
    name: Publish release
    needs: [version, build]
    # Only publish a full release (all platforms, or a tag). Single-platform
    # builds are for iteration and would leave assets missing.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Peerscy v${{ needs.version.outputs.version }}
          make_latest: true
          body: |
            Automated builds of Peerscy v${{ needs.version.outputs.version }}.

            - Linux: x86_64, GPU (Vulkan)
            - Windows: x86_64, GPU (Vulkan)
            - macOS: universal (Intel + Apple Silicon), Metal

            Unsigned: macOS needs right-click → Open on first launch; Windows
            SmartScreen may warn.
          files: |
            artifacts/peerscy-linux-x86_64.tar.gz
            artifacts/peerscy-windows-x86_64.zip
            artifacts/peerscy-macos-universal.dmg
          fail_on_unmatched_files: true

      # Mirror the binaries to Cloudflare R2 so downloads.revyoutech.org serves
      # them (stable filenames at the bucket root). Requires repo secrets:
      # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
      - name: Upload binaries to Cloudflare R2
        # Tolerate a missing R2 setup without failing the release (the GitHub
        # release above is already published); remove this once R2 is live.
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: revyou-downloads
        run: |
          aws s3 cp artifacts/ "s3://$R2_BUCKET/" --recursive \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/octet-stream
          echo "Uploaded binaries to R2 bucket $R2_BUCKET"
